name: DeployForge Secure Build

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Public GitHub repository (owner/repo)"
        required: true
        type: string
      branch:
        description: "Branch to build"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Step 1: Validate user input
      - name: Validate repository input
        env:
          REPOSITORY: ${{ inputs.repository }}
          BRANCH: ${{ inputs.branch }}
        run: |
          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid repository. Use owner/repo."
            exit 1
          fi

          if [[ ! "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] ||
             [[ "$BRANCH" == -* ]] ||
             [[ "$BRANCH" == *..* ]]; then
            echo "Invalid branch name."
            exit 1
          fi

      # Step 2: Checkout submitted repository
      - name: Checkout submitted repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}
          persist-credentials: false

      # Step 3: Ensure repository contains a Dockerfile
      - name: Verify Dockerfile exists
        run: |
          if [ ! -f Dockerfile ]; then
            echo "Build failed: repository has no Dockerfile."
            exit 1
          fi

      # Step 4: Build the container image
      - name: Build container image
        run: |
          docker build \
            --tag deployforge-test:${{ github.run_id }} \
            .

      # Step 5: Scan image with Trivy (Generates JSON report)
      - name: Scan image with Trivy
        id: trivy_scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: deployforge-test:${{ github.run_id }}
          scan-type: image
          format: json
          output: trivy-report.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Step 6: Upload Trivy report as an artifact
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployforge-trivy-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 7

      # Step 7: Security Gate
      - name: Enforce DeployForge security policy
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.trivy_scan.outcome }}
        run: |
          echo "Trivy outcome: $SCAN_OUTCOME"

          if [ "$SCAN_OUTCOME" != "success" ]; then
            echo "Security gate failed."
            echo "Image is NOT approved for deployment."
            exit 1
          fi

          echo "Security gate passed."
          echo "Image is approved for the next deployment stage."